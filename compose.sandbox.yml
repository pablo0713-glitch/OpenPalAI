services:
  trixxie-sandbox:
    build: .
    container_name: trixxie-sandbox
    restart: unless-stopped
    ports:
      - "${SANDBOX_BIND:-127.0.0.1:18080}:8080"
    volumes:
      - ${SANDBOX_DIR:-./.sandbox/linux}/data:/app/data:Z
      - ${SANDBOX_DIR:-./.sandbox/linux}/cache:/root/.cache:Z
      - ${SANDBOX_DIR:-./.sandbox/linux}/.env:/app/.env:Z
    environment:
      - PYTHONUNBUFFERED=1
      - TRIXXIE_DATA_DIR=/app/data
      - TRIXXIE_ENV_FILE=/app/.env
