services:
  openpalai-sandbox:
    build: .
    container_name: openpalai-sandbox
    restart: unless-stopped
    ports:
      - "${SANDBOX_BIND:-127.0.0.1:18080}:8080"
    volumes:
      - ${SANDBOX_DIR:-./.sandbox/linux}/data:/app/data:Z
      - ${SANDBOX_DIR:-./.sandbox/linux}/cache:/root/.cache:Z
      - ${SANDBOX_DIR:-./.sandbox/linux}/.env:/app/.env:Z
    environment:
      - PYTHONUNBUFFERED=1
      - OPENPALAI_DATA_DIR=/app/data
      - OPENPALAI_ENV_FILE=/app/.env
